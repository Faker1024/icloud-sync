[versions]
agp = "8.10.1"
kotlin = "2.2.21"
compose-bom = "2025.05.01"
activity = "1.10.1"
core = "1.16.0"
datastore = "1.1.7"
exifinterface = "1.4.1"
hilt = "2.58"
